name: Build CorePatch-Zygisk module

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_PLATFORM: android-34
  BUILD_TOOLS: 34.0.0
  NDK_VERSION: 26.1.10909125
  CMAKE_VERSION: 3.22.1
  MODULE_ZIP_PATH: runtime/build/module_out/CorePatch-Zygisk.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK packages
        run: |
          sdkmanager \
            "platforms;${{ env.ANDROID_PLATFORM }}" \
            "build-tools;${{ env.BUILD_TOOLS }}" \
            "ndk;${{ env.NDK_VERSION }}" \
            "cmake;${{ env.CMAKE_VERSION }}"

      - name: Configure local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> local.properties
        env:
          ANDROID_NDK_HOME: $ANDROID_HOME/ndk/${{ env.NDK_VERSION }}

      - name: Set Gradle environment
        run: |
          echo "GRADLE_OPTS=-Xmx4g -Dorg.gradle.daemon=false" >> $GITHUB_ENV

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build flashable module zip
        run: ./gradlew :runtime:packageModule --no-daemon --stacktrace

      - name: Verify & Show build output
        run: |
          ls -la runtime/build/module_out/
          test -f "${{ env.MODULE_ZIP_PATH }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CorePatch-Zygisk
          path: ${{ env.MODULE_ZIP_PATH }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MODULE_ZIP_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: $ANDROID_HOME/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ env.NDK_VERSION }}