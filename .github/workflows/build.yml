name: Build CorePatch-Zygisk module

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Point Gradle at the SDK/NDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/26.1.10909125" >> local.properties

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build flashable module zip
        run: ./gradlew :runtime:packageModule --no-daemon --stacktrace

      - name: Show build output
        run: ls -la runtime/build/module_out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CorePatch-Zygisk
          path: runtime/build/module_out/CorePatch-Zygisk.zip

      # On a version tag (vX.Y.Z), publish the zip as a GitHub Release asset.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: runtime/build/module_out/CorePatch-Zygisk.zip
          generate_release_notes: true
