name: Build CorePatch-Zygisk module

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu runner 镜像已预装 Android SDK / NDK / CMake，无需 setup-android
      - name: Check preinstalled SDK components
        run: |
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Point Gradle at the SDK/NDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # 查找预装 NDK 的实际路径并写入 local.properties
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            sdkmanager "ndk;26.1.10909125"
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          fi
          echo "ndk.dir=$NDK_DIR" >> local.properties
          echo "Using NDK at $NDK_DIR"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build flashable module zip
        run: ./gradlew :runtime:packageModule --no-daemon --stacktrace

      - name: Show build output
        run: ls -la runtime/build/module_out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CorePatch-Zygisk
          path: runtime/build/module_out/CorePatch-Zygisk.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: runtime/build/module_out/CorePatch-Zygisk.zip
          generate_release_notes: true
