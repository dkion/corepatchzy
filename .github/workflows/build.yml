name: Build Module

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 如果有子模块（如 zygisk.hpp 单独仓库）

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up NDK and CMake
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: true

      # 如果 CMake 3.22 是单独装的，确保 SDK 里已接受 license
      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: |
          export ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}
          ./gradlew :runtime:packageModule \
            -Pandroid.useAndroidX=true \
            --stacktrace --no-daemon

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: CorePatch-Zygisk
          path: runtime/build/module_out/*.zip

      # 打 tag 时自动发 Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: runtime/build/module_out/*.zip
          generate_release_notes: true
