name: Build CorePatch-Zygisk module

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 把 sdkmanager 加入 PATH（SDK 已预装在 runner 镜像中）
      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Check preinstalled SDK components
        run: |
          sdkmanager --list_installed || true
          ls "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || echo "No NDK preinstalled"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Ensure required SDK packages
        run: |
          # 补装构建所需组件（已存在则秒过）
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Point Gradle at the SDK/NDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT"/ndk/26.1.10909125 2>/dev/null || true)
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "ndk.dir=$NDK_DIR" >> local.properties
          echo "Using NDK at $NDK_DIR"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Build flashable module zip
        run: ./gradlew :runtime:packageModule --no-daemon --stacktrace

      - name: Show build output
        run: ls -la runtime/build/module_out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CorePatch-Zygisk
          path: runtime/build/module_out/CorePatch-Zygisk.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: runtime/build/module_out/CorePatch-Zygisk.zip
          generate_release_notes: true
